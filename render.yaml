services:
  - type: web
    name: kamal-analyst
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: KT_DB_USER
        sync: false
      - key: KT_DB_PASSWORD
        sync: false
      - key: KT_DB_DSN
        sync: false
      - key: KT_APP_USERNAME
        sync: false
      - key: KT_APP_PASSWORD_HASH
        sync: false
      - key: KT_SESSION_SECRET
        sync: false
      - key: KT_SESSION_HTTPS_ONLY
        value: "true"
      - key: KT_ANTHROPIC_API_KEY
        sync: false
      - key: KT_AI_MODEL
        value: claude-sonnet-5
      - key: KT_AI_DAILY_CALL_LIMIT
        value: "200"
      - key: KT_DB_POOL_MAX
        value: "4"
      - key: KT_DB_QUERY_TIMEOUT_MS
        value: "30000"
      - key: KT_DB_ROW_LIMIT
        value: "5000"
